name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      devtool: ${{ steps.filter.outputs.devtool }}
      engine: ${{ steps.filter.outputs.engine }}
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            devtool:
              - 'src/devtool/**'
              - '.cargo/**'
              - '.github/workflows/**'
            engine:
              - 'src/engine_core/**'
              - 'src/cmake/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'vcpkg.json'
              - 'vcpkg-configuration.json'
              - 'vcpkg-overlays/**'
              - 'third_party/**'
              - '.github/workflows/**'
            wasm:
              - 'examples/wasm/**'
              - 'cmake/emscripten-presets.json'
              - 'src/engine_core/**'
              - 'src/cmake/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'vcpkg.json'
              - 'vcpkg-configuration.json'
              - 'vcpkg-overlays/**'
              - 'third_party/**'
              - '.github/workflows/**'

  format-devtool:
    name: Format devtool
    runs-on: windows-latest
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.devtool)
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/devtool
      - name: Format
        working-directory: src/devtool
        run: cargo fmt --check

  build-devtool:
    name: Build and Upload devtool
    needs: [detect-changes, test-devtool]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.detect-changes.outputs.devtool == 'true' ||
       needs.detect-changes.outputs.engine == 'true' ||
       needs.detect-changes.outputs.wasm == 'true')
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Cache devtool binary
        id: devtool-bin-cache
        uses: actions/cache@v4
        with:
          path: src/devtool/target/release/hush${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          key: hush-devtool-bin-${{ runner.os }}-${{ hashFiles('src/devtool/Cargo.toml', 'src/devtool/Cargo.lock', 'src/devtool/src/**', 'src/devtool/templates/**') }}
      - uses: Swatinem/rust-cache@v2
        if: steps.devtool-bin-cache.outputs.cache-hit != 'true'
        with:
          workspaces: src/devtool
      - name: Build release
        if: steps.devtool-bin-cache.outputs.cache-hit != 'true'
        run: cargo build --release
        working-directory: src/devtool
      - name: Upload artifact
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: hush-devtool-${{ matrix.os }}-${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
          path: src/devtool/target/release/hush${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      - name: Upload artifact
        if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: hush-devtool-${{ matrix.os }}-${{ github.sha }}
          path: src/devtool/target/release/hush${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  test-devtool:
    name: Test devtool
    runs-on: ubuntu-latest
    needs: [detect-changes, format-devtool]
    if: always() && !failure() && !cancelled() && fromJSON(needs.detect-changes.outputs.devtool)
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/devtool
      - name: Test
        working-directory: src/devtool
        run: cargo test

  format-hush:
    name: Format hush engine
    needs: [detect-changes, build-devtool]
    if: fromJSON(needs.detect-changes.outputs.engine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Get devtool
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: hush-devtool-windows-latest-${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
      - name: Get devtool
        if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: hush-devtool-windows-latest-${{ github.sha }}
      - name: Rename devtool
        run: mv hush.exe hush-devtool.exe
        shell: bash
      - name: Format hush
        run: ./hush-devtool.exe format --check -v --print-files --all-files

  build-hush-windows:
    name: Build hush engine
    needs: [detect-changes, format-hush, build-devtool]
    if: fromJSON(needs.detect-changes.outputs.engine)
    strategy:
      matrix:
        build-type: [debug, release]
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: "19"
      - name: Get devtool
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: hush-devtool-${{ matrix.os }}-${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
      - name: Get devtool
        if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: hush-devtool-${{ matrix.os }}-${{ github.sha }}
      - name: Rename devtool
        run: mv hush${{ matrix.os == 'windows-latest' && '.exe' || '' }} hush-devtool${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        shell: bash
      - name: Configure MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      - name: Bootstrap VCPKG
        run: ./vcpkg/bootstrap-vcpkg.bat
      - name: Setup vcpkg NuGet credentials
        shell: pwsh
        run: |
          $nuget = & ./vcpkg/vcpkg.exe fetch nuget | Select-Object -Last 1
          $feed  = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          & $nuget sources add -Source $feed -StorePasswordInClearText `
              -Name GitHub -UserName "${{ github.actor }}" `
              -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source $feed
      - name: Configure hush
        run: ./hush-devtool.exe configure --preset windows-x64-${{ matrix.build-type }} -v
      - name: Build hush
        run: ./hush-devtool.exe build --preset windows-x64-${{ matrix.build-type }} -v
      - name: Test hush
        run: ./hush-devtool.exe test --preset windows-x64-${{ matrix.build-type }} -v

  build-hush-wasm:
    name: Build hush engine (Wasm)
    needs: [detect-changes, format-hush, build-devtool]
    if: fromJSON(needs.detect-changes.outputs.wasm)
    strategy:
      matrix:
        build-type: [debug, release]
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest
      - name: Get devtool
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: hush-devtool-windows-latest-${{ github.ref == 'refs/heads/dev' && 'dev' || 'main' }}
      - name: Get devtool
        if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
        uses: actions/download-artifact@v8
        with:
          name: hush-devtool-windows-latest-${{ github.sha }}
      - name: Rename devtool
        run: mv hush.exe hush-devtool.exe
        shell: bash
      - name: Bootstrap VCPKG
        run: ./vcpkg/bootstrap-vcpkg.bat
      - name: Setup vcpkg NuGet credentials
        shell: pwsh
        run: |
          $nuget = & ./vcpkg/vcpkg.exe fetch nuget | Select-Object -Last 1
          $feed  = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          & $nuget sources add -Source $feed -StorePasswordInClearText `
              -Name GitHub -UserName "${{ github.actor }}" `
              -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source $feed
      - name: Configure hush (Wasm)
        run: ./hush-devtool.exe configure --preset wasm-x64-${{ matrix.build-type }} -v
      - name: Build hush (Wasm)
        run: ./hush-devtool.exe build --preset wasm-x64-${{ matrix.build-type }} -v
      - name: Test hush (Wasm)
        run: ./hush-devtool.exe test --preset wasm-x64-${{ matrix.build-type }} -v
